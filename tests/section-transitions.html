<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Section Transition tests</title>
<!--
  Acceptance tests for #1: scroll-linked 3D Section Transitions (rise and tilt).

  Dependency-free: open this page in a Chromium browser that is VISIBLE on
  screen, served over HTTP from the repo root, e.g.
      python -m http.server 8792 --bind 127.0.0.1
      http://127.0.0.1:8792/tests/section-transitions.html
  Headless Chrome does not update scroll-driven timelines, so it cannot run
  these tests, and a hidden tab renders no animation frames.

  The page loads ../index.html into one iframe at a time, sized to each test
  viewport, scrolls it, and reads each Section's computed transform and
  opacity from outside. Results go to #results (one PASS / FAIL / SKIP line per
  test, then a SUMMARY line), to window.__testResults, and document.title
  becomes DONE when finished.

  Tests prefixed guard_ pin behavior the page already has and must keep.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 13px/1.4 ui-monospace, Consolas, monospace; background: #fff; color: #111; }
  #stage { position: fixed; top: 0; left: 0; z-index: 0; }
  #stage iframe { border: 0; display: block; background: #fff; }
  #results {
    position: fixed; right: 0; bottom: 0; z-index: 1; margin: 0;
    max-width: 60vw; max-height: 45vh; overflow: auto; padding: 8px;
    background: rgba(255,255,255,.92); color: #111; border: 1px solid #999;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="stage"></div>
<pre id="results"></pre>
<script>
(async function () {
  'use strict';

  // ---------------------------------------------------------------- results
  const results = { passed: 0, failed: 0, skipped: 0, lines: [] };
  window.__testResults = results;
  const out = document.getElementById('results');
  function record(line) {
    results.lines.push(line);
    out.textContent += line + '\n';
  }
  function pass(name) { results.passed++; record('PASS ' + name); }
  function fail(name, why) { results.failed++; record('FAIL ' + name + ': ' + why); }
  function skip(name, why) { results.skipped++; record('SKIP ' + name + ': ' + why); }

  // ------------------------------------------------------------- tolerances
  // Identity-matrix entries and opacity == 1: 1e-4. Interpolated matrices at
  // the ends of an effect range are exactly identity in Chromium; 1e-4 only
  // guards float noise.
  const EPS = 1e-4;
  // "Partly transparent" / "dimmed": opacity strictly below 0.999.
  const DIM_MAX = 0.999;
  // Edge-width comparison: a real 8-12 degree tilt on a >=300px-wide Section
  // changes the projected edge widths by far more than 0.5px; 0.5px absorbs
  // sub-pixel noise.
  const EDGE_DIFF = 0.5;
  // Band-edge offsets: scroll positions round to device pixels, so positions
  // next to a band edge are taken 2px inside it.
  const BAND_EDGE = 2;
  // Overflow: 1px for sub-pixel rounding of rects.
  const OVERFLOW_TOL = 1;
  // Peak tilt: #1 user story 21 says "roughly 8-12 degrees"; +/-2 degrees for
  // "roughly".
  const TILT_MIN = 6, TILT_MAX = 14;

  // ------------------------------------------------------------------ waits
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // At least two timer ticks (~100ms) so scroll-linked styles update.
  async function settle() { await sleep(50); await sleep(50); }

  // ------------------------------------------------------------- the frame
  const stage = document.getElementById('stage');

  // Opens ../index.html in an iframe of exactly w x h CSS px.
  // opts.reducedMotion: emulate the OS reduced-motion setting.
  // opts.animationsOff: force animations off (stands in for the fallback).
  async function openFrame(w, h, opts) {
    opts = opts || {};
    stage.textContent = '';
    const frame = document.createElement('iframe');
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
    const loaded = new Promise(r => frame.addEventListener('load', r, { once: true }));
    frame.src = '../index.html';
    stage.appendChild(frame);
    await loaded;
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    await doc.fonts.ready;
    if (opts.reducedMotion) emulateReducedMotion(doc);
    if (opts.animationsOff) {
      const s = doc.createElement('style');
      s.textContent = '*,*::before,*::after{animation:none !important}';
      doc.head.appendChild(s);
    }
    await settle();
    await settle();
    const ctx = {
      frame, win, doc, W: w, V: h,
      label: w + 'x' + h,
      el: {
        hero: doc.getElementById('top'),
        about: doc.getElementById('about'),
        experience: doc.getElementById('experience'),
        projects_section: doc.getElementById('work'),
        footer: doc.getElementById('contact'),
      },
    };
    for (const k in ctx.el) {
      if (!ctx.el[k]) throw new Error('Section not found in index.html: ' + k);
    }
    ctx.max = await maxScroll(ctx);
    return ctx;
  }

  // Emulates the OS "reduce motion" accessibility setting inside one frame.
  // Why emulate: the in-app browser used to run these tests cannot toggle the
  // OS setting, and the setting is a system boundary, not page code. With the
  // setting on, rules under @media (prefers-reduced-motion: reduce) start
  // applying, so their CSS text is copied into an unconditional <style> at the
  // end of <head>. Rules that only apply when motion is NOT reduced
  // (prefers-reduced-motion: no-preference, or not (... reduce)) stop
  // applying, so they are deleted from this frame's sheets only.
  function emulateReducedMotion(doc) {
    const copied = [];
    function isMotionQuery(text) { return /prefers-reduced-motion/.test(text); }
    function meansNoPreference(text) {
      return /no-preference/.test(text) || /not\s*\(\s*prefers-reduced-motion/.test(text);
    }
    function walk(group) {
      const rules = group.cssRules;
      for (let i = rules.length - 1; i >= 0; i--) {
        const r = rules[i];
        if (r instanceof doc.defaultView.CSSMediaRule && isMotionQuery(r.conditionText || r.media.mediaText)) {
          const text = r.conditionText || r.media.mediaText;
          if (meansNoPreference(text)) {
            group.deleteRule(i);
          } else {
            const inner = [];
            for (const c of r.cssRules) inner.push(c.cssText);
            copied.unshift(inner.join('\n'));
          }
        } else if (r.cssRules) {
          walk(r);
        }
      }
    }
    for (const sheet of doc.styleSheets) {
      let rules = null;
      try { rules = sheet.cssRules; } catch (e) { continue; } // cross-origin (web fonts)
      if (rules) walk(sheet);
    }
    const s = doc.createElement('style');
    s.textContent = copied.join('\n');
    doc.head.appendChild(s);
  }

  async function scrollToY(ctx, y) {
    ctx.win.scrollTo({ top: y, left: 0, behavior: 'instant' });
    await settle();
    return ctx.win.scrollY;
  }

  async function maxScroll(ctx) {
    const y = await scrollToY(ctx, 1e7);
    await scrollToY(ctx, 0);
    return y;
  }

  // Layout geometry that ignores transforms: offsetTop summed up the
  // offsetParent chain (getBoundingClientRect would include the transform
  // under test).
  function docTop(el) {
    let t = 0;
    for (let e = el; e; e = e.offsetParent) t += e.offsetTop;
    return t;
  }

  // Viewport-relative top (T) and bottom (B) edges of a Section, untransformed.
  function edges(ctx, el) {
    const T = docTop(el) - ctx.win.scrollY;
    return { T, B: T + el.offsetHeight };
  }

  // ----------------------------------------------------------- positions
  // Each position: where to scroll, and the band the Section must be in for
  // the case to be meaningful (checked after clamping to [0, max]).
  const POS = {
    // Entry under way: top edge at 0.9V, i.e. just inside the bottom.
    mid_entry: {
      y: (ctx, el) => docTop(el) - 0.9 * ctx.V,
      band: (ctx, e) => e.T > ctx.V / 2 && e.T < ctx.V && ctx.win.scrollY < ctx.max - 1,
      bandText: 'V/2 < top < V, below max scroll',
    },
    // Entry just complete: top edge 2px above the viewport middle.
    entry_just_complete: {
      y: (ctx, el) => docTop(el) - (ctx.V / 2 - BAND_EDGE),
      band: settledBand, bandText: 'top <= V/2 and bottom >= V/3',
    },
    top_at_viewport_top: {
      y: (ctx, el) => docTop(el),
      band: settledBand, bandText: 'top <= V/2 and bottom >= V/3',
    },
    // Deep inside a tall Section: bottom edge at the viewport bottom.
    bottom_at_viewport_bottom: {
      y: (ctx, el) => docTop(el) + el.offsetHeight - ctx.V,
      band: settledBand, bandText: 'top <= V/2 and bottom >= V/3',
    },
    // Exit not begun yet: bottom edge 2px below the top third.
    just_before_exit: {
      y: (ctx, el) => docTop(el) + el.offsetHeight - (ctx.V / 3 + BAND_EDGE),
      band: settledBand, bandText: 'top <= V/2 and bottom >= V/3',
    },
    // Exit under way: bottom edge at 0.1V.
    mid_exit: {
      y: (ctx, el) => docTop(el) + el.offsetHeight - 0.1 * ctx.V,
      band: (ctx, e) => e.B > 0 && e.B < ctx.V / 3,
      bandText: '0 < bottom < V/3',
    },
  };
  function settledBand(ctx, e) { return e.T <= ctx.V / 2 && e.B >= ctx.V / 3; }

  // Scrolls so `el` is at position `kind`; clamps to [0, max]. Returns null
  // if the clamped position is still in the band, else a SKIP reason.
  async function goTo(ctx, el, kind) {
    const p = POS[kind];
    const want = p.y(ctx, el);
    const clamped = Math.min(Math.max(want, 0), ctx.max);
    await scrollToY(ctx, clamped);
    const e = edges(ctx, el);
    if (!p.band(ctx, e)) {
      return 'unreachable: wanted scrollY ' + want.toFixed(1) + ', clamped to ' +
        ctx.win.scrollY.toFixed(1) + ' (max ' + ctx.max.toFixed(1) + '); Section top ' +
        e.T.toFixed(1) + ', bottom ' + e.B.toFixed(1) + ' is outside band (' + p.bandText +
        ', V=' + ctx.V + ')';
    }
    return null;
  }

  // ------------------------------------------------------------ observables
  function matrixOf(transform) {
    return (!transform || transform === 'none') ? new DOMMatrix() : new DOMMatrix(transform);
  }

  function state(ctx, el) {
    const cs = ctx.win.getComputedStyle(el);
    const origin = cs.transformOrigin.split(/\s+/).map(parseFloat);
    return {
      transform: cs.transform,
      m: matrixOf(cs.transform),
      opacity: parseFloat(cs.opacity),
      ox: origin[0] || 0,
      oy: origin[1] || 0,
      w: el.offsetWidth,
      h: el.offsetHeight,
    };
  }

  function isIdentity(m) {
    const a = m.toFloat64Array();
    const id = new DOMMatrix().toFloat64Array();
    for (let i = 0; i < 16; i++) if (Math.abs(a[i] - id[i]) > EPS) return false;
    return true;
  }

  function isSettled(s) { return isIdentity(s.m) && Math.abs(s.opacity - 1) <= EPS; }

  // Projected widths of the Section's top and bottom edges: corners relative
  // to the computed transform-origin, transformed, then perspective-divided.
  function edgeWidths(s) {
    function pt(x, y) {
      const p = s.m.transformPoint(new DOMPoint(x - s.ox, y - s.oy, 0, 1));
      return { x: p.x / p.w, y: p.y / p.w };
    }
    const TL = pt(0, 0), TR = pt(s.w, 0), BL = pt(0, s.h), BR = pt(s.w, s.h);
    return { top: Math.abs(TR.x - TL.x), bottom: Math.abs(BR.x - BL.x) };
  }

  // Tilt about the horizontal axis, in degrees (verified: rotateX(10deg)
  // gives m22=0.9848, m23=0.1736 in Chromium).
  function tiltDeg(m) { return Math.abs(Math.atan2(m.m23, m.m22) * 180 / Math.PI); }

  function describe(s) {
    return 'transform=' + s.transform + ', opacity=' + s.opacity;
  }

  // ----------------------------------------------------------- assertions
  // Each runs one logical assertion; exceptions become FAILs.
  async function check(name, fn) {
    try {
      const r = await fn();
      if (r && r.skip) skip(name, r.skip);
      else if (r && r.fail) fail(name, r.fail);
      else pass(name);
    } catch (e) {
      fail(name, 'error: ' + (e && e.stack || e));
    }
  }

  async function expectSettledAt(ctx, key, kind) {
    const el = ctx.el[key];
    const why = await goTo(ctx, el, kind);
    if (why) return { skip: why };
    const s = state(ctx, el);
    return isSettled(s) ? null : { fail: 'expected Settled at scrollY ' + ctx.win.scrollY + '; ' + describe(s) };
  }

  async function expectLeansAwayAt(ctx, key, kind) {
    const el = ctx.el[key];
    const why = await goTo(ctx, el, kind);
    if (why) return { skip: why };
    const s = state(ctx, el);
    const e = edgeWidths(s);
    return (e.bottom - e.top > EDGE_DIFF) ? null : {
      fail: 'expected projected top edge narrower than bottom by > ' + EDGE_DIFF + 'px; top=' +
        e.top.toFixed(2) + ', bottom=' + e.bottom.toFixed(2) + ' at scrollY ' + ctx.win.scrollY + '; ' + describe(s),
    };
  }

  async function expectLeansTowardAt(ctx, key, kind) {
    const el = ctx.el[key];
    const why = await goTo(ctx, el, kind);
    if (why) return { skip: why };
    const s = state(ctx, el);
    const e = edgeWidths(s);
    return (e.top - e.bottom > EDGE_DIFF) ? null : {
      fail: 'expected projected top edge wider than bottom by > ' + EDGE_DIFF + 'px; top=' +
        e.top.toFixed(2) + ', bottom=' + e.bottom.toFixed(2) + ' at scrollY ' + ctx.win.scrollY + '; ' + describe(s),
    };
  }

  async function expectDimAt(ctx, key, kind) {
    const el = ctx.el[key];
    const why = await goTo(ctx, el, kind);
    if (why) return { skip: why };
    const s = state(ctx, el);
    return (s.opacity < DIM_MAX) ? null : {
      fail: 'expected opacity < ' + DIM_MAX + ' at scrollY ' + ctx.win.scrollY + '; ' + describe(s),
    };
  }

  // ----------------------------------------------------------------- cases
  const CONTENT = ['about', 'experience', 'projects_section'];
  const HAS_ENTRY = ['about', 'experience', 'projects_section', 'footer'];
  const HAS_EXIT = ['hero', 'about', 'experience', 'projects_section'];
  const ANCHOR = { about: 'about', experience: 'experience', projects_section: 'work' };

  async function stateTests(w, h) {
    const ctx = await openFrame(w, h);
    const at = '@' + ctx.label;

    // Hero: no Entry, Settled at 0; has an Exit.
    await check('guard_hero_settled_at_scroll_zero' + at, async () => {
      await scrollToY(ctx, 0);
      const s = state(ctx, ctx.el.hero);
      return isSettled(s) ? null : { fail: 'expected Settled at scrollY 0; ' + describe(s) };
    });
    await check('hero_mid_exit_top_edge_leans_toward_viewer' + at, () => expectLeansTowardAt(ctx, 'hero', 'mid_exit'));
    await check('hero_mid_exit_dimmed' + at, () => expectDimAt(ctx, 'hero', 'mid_exit'));

    for (const key of CONTENT) {
      await check(key + '_mid_entry_top_edge_leans_away' + at, () => expectLeansAwayAt(ctx, key, 'mid_entry'));
      await check(key + '_mid_entry_partly_transparent' + at, () => expectDimAt(ctx, key, 'mid_entry'));
      await check('guard_' + key + '_settled_when_entry_just_complete' + at, () => expectSettledAt(ctx, key, 'entry_just_complete'));
      await check('guard_' + key + '_settled_with_top_at_viewport_top' + at, () => expectSettledAt(ctx, key, 'top_at_viewport_top'));
      await check('guard_' + key + '_settled_with_bottom_at_viewport_bottom' + at, () => expectSettledAt(ctx, key, 'bottom_at_viewport_bottom'));
      await check('guard_' + key + '_settled_just_before_exit' + at, () => expectSettledAt(ctx, key, 'just_before_exit'));
      await check(key + '_mid_exit_top_edge_leans_toward_viewer' + at, () => expectLeansTowardAt(ctx, key, 'mid_exit'));
      await check(key + '_mid_exit_dimmed' + at, () => expectDimAt(ctx, key, 'mid_exit'));

      // Scroll-linked and reversible: the same position gives the same state
      // however you got there, and that state is a real mid-Entry state.
      await check(key + '_transition_reversible_after_scrolling_away_and_back' + at, async () => {
        const el = ctx.el[key];
        const why = await goTo(ctx, el, 'mid_entry');
        if (why) return { skip: why };
        const y = ctx.win.scrollY;
        const first = state(ctx, el);
        await scrollToY(ctx, ctx.max);
        await scrollToY(ctx, y);
        const again = state(ctx, el);
        const a = first.m.toFloat64Array(), b = again.m.toFloat64Array();
        let same = Math.abs(first.opacity - again.opacity) <= EPS;
        for (let i = 0; i < 16; i++) if (Math.abs(a[i] - b[i]) > EPS) same = false;
        if (!same) return { fail: 'state changed after scrolling away and back to scrollY ' + y + ': first ' + describe(first) + '; again ' + describe(again) };
        if (isSettled(first)) return { fail: 'state at mid-Entry (scrollY ' + y + ') is Settled, so there is no Section Transition to reverse; ' + describe(first) };
        return null;
      });
    }

    // Footer: has an Entry, no Exit.
    await check('footer_mid_entry_top_edge_leans_away' + at, () => expectLeansAwayAt(ctx, 'footer', 'mid_entry'));
    await check('footer_mid_entry_partly_transparent' + at, () => expectDimAt(ctx, 'footer', 'mid_entry'));

    // Anchor landing (nav links smooth-scroll): wait until scrollY is stable.
    for (const key of CONTENT) {
      await check('guard_' + key + '_settled_after_anchor_landing' + at, async () => {
        await scrollToY(ctx, 0);
        ctx.win.location.hash = '#' + ANCHOR[key];
        let last = NaN, stable = 0;
        for (let i = 0; i < 150 && stable < 5; i++) {
          await sleep(100);
          const y = ctx.win.scrollY;
          stable = (y === last) ? stable + 1 : 0;
          last = y;
        }
        if (stable < 5) return { fail: 'scroll never came to rest after navigating to #' + ANCHOR[key] };
        await settle();
        const s = state(ctx, ctx.el[key]);
        return isSettled(s) ? null : { fail: 'expected Settled after landing on #' + ANCHOR[key] + ' (scrollY ' + ctx.win.scrollY + '); ' + describe(s) };
      });
    }
  }

  async function footerAtMax(w, h) {
    const ctx = await openFrame(w, h);
    await check('guard_footer_settled_at_max_scroll@' + ctx.label, async () => {
      await scrollToY(ctx, ctx.max);
      const s = state(ctx, ctx.el.footer);
      return isSettled(s) ? null : { fail: 'expected Settled at max scrollY ' + ctx.max + '; ' + describe(s) };
    });
  }

  // Sampled on Experience, not About: at 1280x800 About's top already sits at
  // ~0.86V at scrollY 0, so the start of its Entry (where the tilt peaks) is
  // unreachable. Experience's whole Entry range is reachable.
  async function peakTilt() {
    const ctx = await openFrame(1280, 800);
    await check('experience_peak_entry_tilt_is_subtle@' + ctx.label, async () => {
      const el = ctx.el.experience;
      let peak = 0, at = null;
      const steps = 10;
      for (let i = 0; i < steps; i++) {
        const f = 0.98 - (0.98 - 0.55) * i / (steps - 1);
        const want = docTop(el) - f * ctx.V;
        if (want < 0 || want > ctx.max) {
          return { skip: 'unreachable: top at ' + f.toFixed(3) + 'V needs scrollY ' + want.toFixed(1) + ' outside [0, ' + ctx.max.toFixed(1) + ']' };
        }
        await scrollToY(ctx, want);
        const t = tiltDeg(state(ctx, el).m);
        if (t > peak) { peak = t; at = f; }
      }
      return (peak >= TILT_MIN && peak <= TILT_MAX) ? null : {
        fail: 'expected peak tilt in [' + TILT_MIN + ', ' + TILT_MAX + '] degrees; observed ' +
          peak.toFixed(2) + ' degrees' + (at === null ? '' : ' (top at ' + at.toFixed(3) + 'V)'),
      };
    });
  }

  // Reduced motion and the fallback: every Section Settled at each Section's
  // mid-Entry and mid-Exit positions.
  async function allSettledTests(w, h, opts, suffix) {
    const ctx = await openFrame(w, h, opts);
    const at = '_' + suffix + '@' + ctx.label;
    const positions = HAS_ENTRY.map(k => [k, 'mid_entry']).concat(HAS_EXIT.map(k => [k, 'mid_exit']));
    for (const [key, kind] of positions) {
      await check('guard_every_section_settled_at_' + key + '_' + kind + at, async () => {
        const why = await goTo(ctx, ctx.el[key], kind);
        if (why) return { skip: why };
        const bad = [];
        for (const k in ctx.el) {
          const s = state(ctx, ctx.el[k]);
          if (!isSettled(s)) bad.push(k + ' (' + describe(s) + ')');
        }
        return bad.length ? { fail: 'not Settled at scrollY ' + ctx.win.scrollY + ': ' + bad.join('; ') } : null;
      });
    }
  }

  // No horizontal overflow: document no wider than the viewport, every
  // Section's (transformed) box within [-1, W+1].
  async function overflowTests(w, h) {
    const ctx = await openFrame(w, h);
    const at = '@' + ctx.label;
    function overflowFindings() {
      const W = ctx.win.innerWidth;
      const found = [];
      const sw = ctx.doc.documentElement.scrollWidth;
      if (sw > W) found.push('documentElement.scrollWidth ' + sw + ' > innerWidth ' + W);
      for (const k in ctx.el) {
        const r = ctx.el[k].getBoundingClientRect();
        if (r.left < -OVERFLOW_TOL || r.right > W + OVERFLOW_TOL) {
          found.push(k + ' rect [' + r.left.toFixed(2) + ', ' + r.right.toFixed(2) + '] outside [0, ' + W + ']');
        }
      }
      return found.length ? { fail: found.join('; ') + ' at scrollY ' + ctx.win.scrollY } : null;
    }
    await check('guard_no_horizontal_overflow_at_scroll_zero' + at, async () => {
      await scrollToY(ctx, 0);
      return overflowFindings();
    });
    const positions = HAS_ENTRY.map(k => [k, 'mid_entry']).concat(HAS_EXIT.map(k => [k, 'mid_exit']));
    for (const [key, kind] of positions) {
      await check('guard_no_horizontal_overflow_at_' + key + '_' + kind + at, async () => {
        const why = await goTo(ctx, ctx.el[key], kind);
        if (why) return { skip: why };
        return overflowFindings();
      });
    }
    await check('guard_no_horizontal_overflow_at_max_scroll' + at, async () => {
      await scrollToY(ctx, ctx.max);
      return overflowFindings();
    });
  }

  // ------------------------------------------------------------------- run
  try {
    for (const [w, h] of [[1280, 800], [375, 812]]) await stateTests(w, h);
    for (const [w, h] of [[1280, 700], [1280, 1000], [375, 812]]) await footerAtMax(w, h);
    await peakTilt();
    for (const [w, h] of [[1280, 800], [375, 812]]) await allSettledTests(w, h, { reducedMotion: true }, 'with_reduced_motion');
    for (const [w, h] of [[1280, 800], [375, 812]]) await allSettledTests(w, h, { animationsOff: true }, 'with_animations_off');
    for (const [w, h] of [[320, 720], [375, 812], [768, 1024], [1440, 900]]) await overflowTests(w, h);
  } catch (e) {
    fail('harness', 'error: ' + (e && e.stack || e));
  }
  stage.textContent = '';
  record('SUMMARY passed=' + results.passed + ' failed=' + results.failed + ' skipped=' + results.skipped);
  document.title = 'DONE';
})();
</script>
</body>
</html>
