<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav link tests</title>
<!--
  Regression tests for #1: the top bar's nav links stay clickable over the
  Hero. The Hero's Exit animation makes it a stacking context from page load,
  which once let its background glow paint and hit-test above the top bar.

  Dependency-free: open this page in a Chromium browser that is VISIBLE on
  screen, served over HTTP from the repo root, e.g.
      python -m http.server 8792 --bind 127.0.0.1
      http://127.0.0.1:8792/tests/nav-links.html

  The page loads ../index.html into one iframe per viewport and, at scrollY 0,
  checks that each .topbar nav a is the elementFromPoint target at its own
  centre. Results go to #results (one PASS / FAIL / SKIP line per test, then a
  SUMMARY line), to window.__testResults, and document.title becomes DONE.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 13px/1.4 ui-monospace, Consolas, monospace; background: #fff; color: #111; }
  #stage { position: fixed; top: 0; left: 0; z-index: 0; }
  #stage iframe { border: 0; display: block; background: #fff; }
  #results {
    position: fixed; right: 0; bottom: 0; z-index: 1; margin: 0;
    max-width: 60vw; max-height: 45vh; overflow: auto; padding: 8px;
    background: rgba(255,255,255,.92); color: #111; border: 1px solid #999;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="stage"></div>
<pre id="results"></pre>
<script>
(async function () {
  'use strict';

  const results = { passed: 0, failed: 0, skipped: 0, lines: [] };
  window.__testResults = results;
  const out = document.getElementById('results');
  function record(line) {
    results.lines.push(line);
    out.textContent += line + '\n';
  }
  function pass(name) { results.passed++; record('PASS ' + name); }
  function fail(name, why) { results.failed++; record('FAIL ' + name + ': ' + why); }

  // At least two timer ticks (~100ms) so scroll-linked styles update.
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function settle() { await sleep(50); await sleep(50); }

  const stage = document.getElementById('stage');

  async function openFrame(w, h) {
    stage.textContent = '';
    const frame = document.createElement('iframe');
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
    const loaded = new Promise(r => frame.addEventListener('load', r, { once: true }));
    frame.src = '../index.html';
    stage.appendChild(frame);
    await loaded;
    await frame.contentDocument.fonts.ready;
    await settle();
    frame.contentWindow.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    await settle();
    return { win: frame.contentWindow, doc: frame.contentDocument, label: w + 'x' + h };
  }

  function describeEl(el) {
    if (!el) return 'null';
    let s = el.tagName + (el.id ? '#' + el.id : '');
    if (el.className && typeof el.className === 'string') s += '.' + el.className.trim().split(/\s+/).join('.');
    return s;
  }

  async function navTests(w, h) {
    const ctx = await openFrame(w, h);
    const links = ctx.doc.querySelectorAll('.topbar nav a');
    if (!links.length) { fail('nav_links_present@' + ctx.label, 'no .topbar nav a in index.html'); return; }
    for (const a of links) {
      const name = 'nav_link_' + a.textContent.trim().toLowerCase() + '_is_hit_target_at_its_centre@' + ctx.label;
      try {
        const r = a.getBoundingClientRect();
        const x = r.left + r.width / 2, y = r.top + r.height / 2;
        const hit = ctx.doc.elementFromPoint(x, y);
        if (hit === a || a.contains(hit)) pass(name);
        else fail(name, 'elementFromPoint(' + x.toFixed(1) + ', ' + y.toFixed(1) + ') at scrollY ' +
          ctx.win.scrollY + ' is ' + describeEl(hit) + ', not the link');
      } catch (e) {
        fail(name, 'error: ' + (e && e.stack || e));
      }
    }
  }

  try {
    for (const [w, h] of [[320, 720], [375, 812], [563, 900], [768, 900], [1280, 800]]) await navTests(w, h);
  } catch (e) {
    fail('harness', 'error: ' + (e && e.stack || e));
  }
  stage.textContent = '';
  record('SUMMARY passed=' + results.passed + ' failed=' + results.failed + ' skipped=' + results.skipped);
  document.title = 'DONE';
})();
</script>
</body>
</html>
